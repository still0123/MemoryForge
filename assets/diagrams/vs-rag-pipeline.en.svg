<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1156" viewBox="0 0 1600 1156" role="img" aria-labelledby="title desc">
<title id="title">Same sources, two knowledge pipelines</title>
<desc id="desc">Vanilla RAG retrieves raw chunks; MemoryForge compiles sources into an auditable Wiki first, then queries progressively.</desc>
<defs>
  <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#17335C" flood-opacity="0.10"/>
  </filter>
  <filter id="vsShadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17335C" flood-opacity="0.14"/>
  </filter>
  <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1664FF"/>
    <stop offset="1" stop-color="#5B5CE2"/>
  </linearGradient>
  <marker id="arrowGray" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L10,5.5 L0,11 z" fill="#8CA0BE"/>
  </marker>
  <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L10,5.5 L0,11 z" fill="#18A980"/>
  </marker>
</defs>
<rect width="1600" height="1156" fill="#F5F8FF"/>
<text x="70" y="66" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="800" fill="#1F2329" text-anchor="start" letter-spacing="0">Same sources, two knowledge pipelines</text>
<text x="70" y="102" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="450" fill="#69758C" text-anchor="start" letter-spacing="0">Vanilla RAG retrieves raw chunks; MemoryForge compiles sources into an auditable Wiki first, then queries progressively.</text>
<path d="M70 124 L1530 124" fill="none" stroke="#D9E4F5" stroke-width="1" stroke-linecap="round"/><rect x="60" y="156" width="700" height="760" rx="22" fill="#FFFFFF" stroke="#D9E4F5" stroke-width="1.5" filter="url(#panelShadow)"/><path d="M 60 178 A 22 22 0 0 1 82 156 L 738 156 A 22 22 0 0 1 760 178 L 760 234 L 60 234 Z" fill="#F1F4F9"/><text x="86" y="190" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="800" fill="#14213D" text-anchor="start" letter-spacing="0">Vanilla RAG</text><text x="86" y="216" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="450" fill="#69758C" text-anchor="start" letter-spacing="0">chunk → embed → recall → generate</text><rect x="82" y="252" width="656" height="80" rx="12" fill="#F7F9FC" stroke="#E3EAF4" stroke-width="1"/><rect x="82" y="266" width="4" height="52" rx="2" fill="#8CA0BE"/><text x="104" y="285" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="750" fill="#1F2329" text-anchor="start" letter-spacing="0">Raw sources</text><text x="104" y="310" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start" letter-spacing="0">Docs, code, pages updated at will</text><circle cx="720" cy="292" r="10" fill="#FFE9E9"/><text x="720" y="297" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#D94A4A" text-anchor="middle" letter-spacing="0">✗</text><text x="700" y="296.5" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="650" fill="#D94A4A" text-anchor="end" letter-spacing="0">No version pinning</text><line x1="410" y1="338" x2="410" y2="370" stroke="#8CA0BE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowGray)"/><rect x="82" y="376" width="656" height="80" rx="12" fill="#F7F9FC" stroke="#E3EAF4" stroke-width="1"/><rect x="82" y="390" width="4" height="52" rx="2" fill="#8CA0BE"/><text x="104" y="409" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="750" fill="#1F2329" text-anchor="start" letter-spacing="0">Fixed-window chunking</text><text x="104" y="434" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start" letter-spacing="0">Structure and context lost at chunk time</text><circle cx="720" cy="416" r="10" fill="#FFE9E9"/><text x="720" y="421" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#D94A4A" text-anchor="middle" letter-spacing="0">✗</text><text x="700" y="420.5" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="650" fill="#D94A4A" text-anchor="end" letter-spacing="0">Fragmented semantics</text><line x1="410" y1="462" x2="410" y2="494" stroke="#8CA0BE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowGray)"/><rect x="82" y="500" width="656" height="80" rx="12" fill="#F7F9FC" stroke="#E3EAF4" stroke-width="1"/><rect x="82" y="514" width="4" height="52" rx="2" fill="#8CA0BE"/><text x="104" y="533" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="750" fill="#1F2329" text-anchor="start" letter-spacing="0">Embed into vector store</text><text x="104" y="558" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start" letter-spacing="0">Re-indexing silently replaces old data</text><circle cx="720" cy="540" r="10" fill="#FFE9E9"/><text x="720" y="545" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#D94A4A" text-anchor="middle" letter-spacing="0">✗</text><text x="700" y="544.5" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="650" fill="#D94A4A" text-anchor="end" letter-spacing="0">No review trail</text><line x1="410" y1="586" x2="410" y2="618" stroke="#8CA0BE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowGray)"/><rect x="82" y="624" width="656" height="80" rx="12" fill="#F7F9FC" stroke="#E3EAF4" stroke-width="1"/><rect x="82" y="638" width="4" height="52" rx="2" fill="#8CA0BE"/><text x="104" y="657" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="750" fill="#1F2329" text-anchor="start" letter-spacing="0">Top-K similarity recall</text><text x="104" y="682" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start" letter-spacing="0">Picks fragments by vector distance</text><circle cx="720" cy="664" r="10" fill="#FFE9E9"/><text x="720" y="669" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#D94A4A" text-anchor="middle" letter-spacing="0">✗</text><text x="700" y="668.5" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="650" fill="#D94A4A" text-anchor="end" letter-spacing="0">Relevant ≠ supported</text><line x1="410" y1="710" x2="410" y2="742" stroke="#8CA0BE" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowGray)"/><rect x="82" y="748" width="656" height="80" rx="12" fill="#F7F9FC" stroke="#E3EAF4" stroke-width="1"/><rect x="82" y="762" width="4" height="52" rx="2" fill="#8CA0BE"/><text x="104" y="781" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="750" fill="#1F2329" text-anchor="start" letter-spacing="0">LLM answers directly</text><text x="104" y="806" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start" letter-spacing="0">Uses whatever was recalled</text><circle cx="720" cy="788" r="10" fill="#FFE9E9"/><text x="720" y="793" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="800" fill="#D94A4A" text-anchor="middle" letter-spacing="0">✗</text><text x="700" y="792.5" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="650" fill="#D94A4A" text-anchor="end" letter-spacing="0">Citation drift</text><rect x="82" y="850" width="656" height="62" rx="14" fill="#FFF1F1"/><text x="410" y="887" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="700" fill="#B93838" text-anchor="middle" letter-spacing="0">Not replayable: no way to tell which version of which passage a claim came from</text><rect x="840" y="156" width="700" height="884" rx="22" fill="#FFFFFF" stroke="#18A980" stroke-width="2" filter="url(#panelShadow)"/><path d="M 840 178 A 22 22 0 0 1 862 156 L 1518 156 A 22 22 0 0 1 1540 178 L 1540 234 L 840 234 Z" fill="#DDF7EE"/><text x="866" y="190" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="800" fill="#17885F" text-anchor="start" letter-spacing="0">MemoryForge</text><text x="866" y="216" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="450" fill="#69758C" text-anchor="start" letter-spacing="0">snapshot → propose → review → publish → progressive query</text><rect x="862" y="252" width="656" height="80" rx="12" fill="#F7F9FC" stroke="#E3EAF4" stroke-width="1"/><rect x="862" y="266" width="4" height="52" rx="2" fill="#18A980"/><text x="884" y="285" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="750" fill="#1F2329" text-anchor="start" letter-spacing="0">Raw sources</text><text x="884" y="310" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start" letter-spacing="0">Git repos, Feishu, web, Issues, AI chats</text><circle cx="1500" cy="292" r="10" fill="#DDF7EE"/><path d="M 1495.5 292.5 L 1498.8 296 L 1504.6 288.4" fill="none" stroke="#17885F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1480" y="296.5" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="650" fill="#17885F" text-anchor="end" letter-spacing="0">local_only by default</text><line x1="1190" y1="338" x2="1190" y2="370" stroke="#18A980" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowGreen)"/><rect x="862" y="376" width="656" height="80" rx="12" fill="#F7F9FC" stroke="#E3EAF4" stroke-width="1"/><rect x="862" y="390" width="4" height="52" rx="2" fill="#18A980"/><text x="884" y="409" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="750" fill="#1F2329" text-anchor="start" letter-spacing="0">SourceAdapter snapshot</text><text x="884" y="434" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start" letter-spacing="0">Immutable SourceVersion pinned by SHA-256</text><circle cx="1500" cy="416" r="10" fill="#DDF7EE"/><path d="M 1495.5 416.5 L 1498.8 420 L 1504.6 412.4" fill="none" stroke="#17885F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1480" y="420.5" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="650" fill="#17885F" text-anchor="end" letter-spacing="0">Replayable source</text><line x1="1190" y1="462" x2="1190" y2="494" stroke="#18A980" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowGreen)"/><rect x="862" y="500" width="656" height="80" rx="12" fill="#F7F9FC" stroke="#E3EAF4" stroke-width="1"/><rect x="862" y="514" width="4" height="52" rx="2" fill="#18A980"/><text x="884" y="533" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="750" fill="#1F2329" text-anchor="start" letter-spacing="0">WikiCompiler proposal</text><text x="884" y="558" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start" letter-spacing="0">Emits PROPOSED ChangeSets only</text><circle cx="1500" cy="540" r="10" fill="#DDF7EE"/><path d="M 1495.5 540.5 L 1498.8 544 L 1504.6 536.4" fill="none" stroke="#17885F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1480" y="544.5" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="650" fill="#17885F" text-anchor="end" letter-spacing="0">AI never publishes</text><line x1="1190" y1="586" x2="1190" y2="618" stroke="#18A980" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowGreen)"/><rect x="862" y="624" width="656" height="80" rx="12" fill="#F7F9FC" stroke="#E3EAF4" stroke-width="1"/><rect x="862" y="638" width="4" height="52" rx="2" fill="#18A980"/><text x="884" y="657" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="750" fill="#1F2329" text-anchor="start" letter-spacing="0">review → approve → apply</text><text x="884" y="682" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start" letter-spacing="0">Human reviews diff &amp; citations, then authorizes</text><circle cx="1500" cy="664" r="10" fill="#DDF7EE"/><path d="M 1495.5 664.5 L 1498.8 668 L 1504.6 660.4" fill="none" stroke="#17885F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1480" y="668.5" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="650" fill="#17885F" text-anchor="end" letter-spacing="0">Git rollback</text><line x1="1190" y1="710" x2="1190" y2="742" stroke="#18A980" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowGreen)"/><rect x="862" y="748" width="656" height="80" rx="12" fill="#F7F9FC" stroke="#E3EAF4" stroke-width="1"/><rect x="862" y="762" width="4" height="52" rx="2" fill="#18A980"/><text x="884" y="781" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="750" fill="#1F2329" text-anchor="start" letter-spacing="0">Wiki + SQLite FTS5</text><text x="884" y="806" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start" letter-spacing="0">Readable Markdown + local full-text index</text><circle cx="1500" cy="788" r="10" fill="#DDF7EE"/><path d="M 1495.5 788.5 L 1498.8 792 L 1504.6 784.4" fill="none" stroke="#17885F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1480" y="792.5" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="650" fill="#17885F" text-anchor="end" letter-spacing="0">One base for human &amp; AI</text><line x1="1190" y1="834" x2="1190" y2="866" stroke="#18A980" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowGreen)"/><rect x="862" y="872" width="656" height="80" rx="12" fill="#F7F9FC" stroke="#E3EAF4" stroke-width="1"/><rect x="862" y="886" width="4" height="52" rx="2" fill="#18A980"/><text x="884" y="905" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="750" fill="#1F2329" text-anchor="start" letter-spacing="0">Progressive query</text><text x="884" y="930" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start" letter-spacing="0">INDEX.md → Citation → Evidence on demand</text><circle cx="1500" cy="912" r="10" fill="#DDF7EE"/><path d="M 1495.5 912.5 L 1498.8 916 L 1504.6 908.4" fill="none" stroke="#17885F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1480" y="916.5" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="650" fill="#17885F" text-anchor="end" letter-spacing="0">Context on demand</text><rect x="862" y="974" width="656" height="62" rx="14" fill="#E4F8F0"/><text x="1190" y="1011" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="700" fill="#14684A" text-anchor="middle" letter-spacing="0">Replayable: citations pin SourceVersion + locator + Commit + SHA-256</text><circle cx="800" cy="200" r="32" fill="url(#brandGrad)" filter="url(#vsShadow)"/><text x="800" y="208" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="850" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">VS</text><rect x="220" y="1074" width="1160" height="52" rx="16" fill="#102A56" filter="url(#panelShadow)"/><text x="800" y="1107" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="16.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">MemoryForge is not “better retrieval” — it turns knowledge updates into an auditable pipeline: compile, review, publish, trace.</text>
</svg>
