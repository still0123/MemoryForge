<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="670" viewBox="0 0 1440 670" role="img" aria-labelledby="title description">
  <title id="title">MemoryForge 工作流</title>
  <desc id="description">资料输入，经由可审核的 Wiki 编译器，变成可渐进检索的个人技术 Wiki，并通过命令行或飞书提供带来源的回答。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #475569; }
      .section { font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1e293b; }
      .detail { font: 400 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #64748b; }
      .caption { font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4f46e5; }
      .white { font: 700 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: white; }
    </style>
  </defs>

  <rect width="1440" height="670" rx="28" fill="url(#background)"/>
  <text x="72" y="74" class="title">MemoryForge：把分散资料变成可提问的个人技术 Wiki</text>
  <text x="72" y="106" class="subtitle">本地优先 · 可审核编译 · 渐进式查询 · 带来源回答 · 飞书展示</text>

  <g filter="url(#shadow)">
    <rect x="70" y="164" width="255" height="336" rx="20" fill="#ffffff"/>
    <rect x="365" y="164" width="295" height="336" rx="20" fill="#ffffff"/>
    <rect x="700" y="164" width="295" height="336" rx="20" fill="#ffffff"/>
    <rect x="1035" y="164" width="335" height="336" rx="20" fill="#ffffff"/>
  </g>

  <text x="95" y="207" class="section">1. 指定资料</text>
  <rect x="94" y="235" width="207" height="50" rx="12" fill="#eef2ff"/>
  <text x="114" y="266" class="label">本地 Git 仓库</text>
  <rect x="94" y="300" width="207" height="50" rx="12" fill="#eef2ff"/>
  <text x="114" y="331" class="label">设计文档 / Markdown</text>
  <rect x="94" y="365" width="207" height="50" rx="12" fill="#eef2ff"/>
  <text x="114" y="396" class="label">飞书文档 / 公开网页</text>
  <text x="95" y="462" class="detail">资料先留在本地 Workspace</text>

  <text x="390" y="207" class="section">2. Wiki 编译器</text>
  <rect x="390" y="235" width="245" height="50" rx="12" fill="#ede9fe"/>
  <text x="410" y="266" class="label">来源快照 + 版本</text>
  <rect x="390" y="300" width="245" height="50" rx="12" fill="#ede9fe"/>
  <text x="410" y="331" class="label">生成 Wiki 页面草稿</text>
  <rect x="390" y="365" width="245" height="50" rx="12" fill="#ede9fe"/>
  <text x="410" y="396" class="label">review → approve → apply</text>
  <text x="390" y="462" class="detail">只更新受影响的已有主题</text>

  <text x="725" y="207" class="section">3. 渐进式 Wiki 记忆</text>
  <rect x="725" y="235" width="245" height="50" rx="12" fill="#e0f2fe"/>
  <text x="745" y="266" class="label">INDEX.md 总目录</text>
  <rect x="725" y="300" width="245" height="50" rx="12" fill="#e0f2fe"/>
  <text x="745" y="331" class="label">SQLite FTS5 候选</text>
  <rect x="725" y="365" width="245" height="50" rx="12" fill="#e0f2fe"/>
  <text x="745" y="396" class="label">少量页面 + 按需原文</text>
  <text x="725" y="462" class="detail">不把整个知识库塞进上下文</text>

  <text x="1060" y="207" class="section">4. 问答与展示</text>
  <rect x="1060" y="235" width="285" height="50" rx="12" fill="#dcfce7"/>
  <text x="1080" y="266" class="label">带来源的 Wiki 问答</text>
  <rect x="1060" y="300" width="285" height="50" rx="12" fill="#dcfce7"/>
  <text x="1080" y="331" class="label">MiniClaude Agent</text>
  <rect x="1060" y="365" width="285" height="50" rx="12" fill="#dcfce7"/>
  <text x="1080" y="396" class="label">CLI / 飞书私聊机器人</text>
  <text x="1060" y="462" class="detail">回答可回到对应来源核验</text>

  <path d="M325 332 H351" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M660 332 H686" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M995 332 H1021" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="70" y="550" width="1300" height="66" rx="18" fill="url(#accent)"/>
  <text x="105" y="591" class="white">项目核心：把一次性资料导入，变成能随资料更新而持续维护、可解释、可追溯的技术 Wiki。</text>
  <text x="1155" y="591" class="white">local-first</text>
</svg>
