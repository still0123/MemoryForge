<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MemoryForge 发布链</title>
<desc id="desc">从不可变来源快照到可回滚 Wiki Commit 的可审核发布流程。</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17335C" flood-opacity="0.10"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17335C" flood-opacity="0.09"/>
  </filter>
  <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1664FF"/>
    <stop offset="1" stop-color="#5B5CE2"/>
  </linearGradient>
  <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#23B88B"/>
    <stop offset="1" stop-color="#0F9FA8"/>
  </linearGradient>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F9FBFF"/>
    <stop offset="1" stop-color="#EEF4FF"/>
  </linearGradient>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L10,5.5 L0,11 z" fill="#8CA0BE"/>
  </marker>
  <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L10,5.5 L0,11 z" fill="#1664FF"/>
  </marker>
  <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L10,5.5 L0,11 z" fill="#18A980"/>
  </marker>
  <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L10,5.5 L0,11 z" fill="#D94A4A"/>
  </marker>
</defs>
<rect width="1600" height="900" rx="0" fill="#F5F8FF"/>
<text x="70" y="70" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="800" fill="#1F2329" text-anchor="start" opacity="1" letter-spacing="0">知识如何进入正式 Wiki？</text><text x="70" y="108" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#69758C" text-anchor="start" opacity="1" letter-spacing="0">模型只能提出 ChangeSet；review、approve、apply 分离并留下可审计记录。</text><path d="M70 131 L1530 131" fill="none" stroke="#D9E4F5" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="52.0" y="240" width="281.6" height="300" rx="22" fill="#FFFFFF" stroke="#D9E4F5" stroke-width="1" opacity="1" filter="url(#shadow)"/><rect x="72.0" y="260" width="58" height="34" rx="17" fill="#E8F1FF" stroke="none" stroke-width="1" opacity="1"/><text x="101.0" y="283" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#1664FF" text-anchor="middle" opacity="1" letter-spacing="0">01</text><rect x="166.96" y="342.4" width="51.68000000000001" height="39.52" rx="9.12" fill="#E8F1FF" stroke="none" stroke-width="1" opacity="1"/><path d="M177.60000000000002 343.92 V334.8 C177.60000000000002 316.56 208.0 316.56 208.0 334.8 V343.92" fill="none" stroke="#1664FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><circle cx="192.8" cy="360.64" r="4.56" fill="#1664FF" stroke="none" stroke-width="1"/><text x="192.8" y="425" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="780" fill="#1F2329" text-anchor="middle" opacity="1" letter-spacing="0">不可变来源快照</text><text x="192.8" y="462" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#69758C" text-anchor="middle"><tspan x="192.8" dy="0">SourceAdapter 标准化</tspan><tspan x="192.8" dy="28">SourceVersion + raw blob</tspan></text><rect x="72.0" y="492" wid