er-spacing="0">WikiCompiler 生成提案</text><text x="496.40000000000003" y="462" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#69758C" text-anchor="middle"><tspan x="496.40000000000003" dy="0">CompilationPlan</tspan><tspan x="496.40000000000003" dy="28">PageChange → ChangeSet</tspan></text><rect x="375.6" y="492" width="241.60000000000002" height="34" rx="17" fill="#DFF7F8" stroke="none" stroke-width="1" opacity="1"/><text x="496.40000000000003" y="515" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#0F9FA8" text-anchor="middle" opacity="1" letter-spacing="0">模型不能越过 staging</text><path d="M642.2 390.0 L653.2 390.0" fill="none" stroke="#8CA0BE" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" opacity="1"/><rect x="659.2" y="240" width="281.6" height="300" rx="22" fill="#FFFFFF" stroke="#D9E4F5" stroke-width="1" opacity="1" filter="url(#shadow)"/><rect x="679.2" y="260" width="58" height="34" rx="17" fill="#FFF4D6" stroke="none" stroke-width="1" opacity="1"/><text x="708.2" y="283" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#E59B19" text-anchor="middle" opacity="1" letter-spacing="0">03</text><rect x="762.0" y="312" width="76" height="76" rx="16.72" fill="#FFF4D6" stroke="none" stroke-width="1" opacity="1"/><path d="M775.68 336.32 L798.48 336.32" fill="none" stroke="#D94A4A" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M775.68 351.52 L807.6 351.52" fill="none" stroke="#18A980" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M775.68 366.72 L818.24 366.72" fill="none" stroke="#18A980" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="800.0" y="425" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="780" fill="#1F2329" text-anchor="middle" opacity="1" letter-spacing="0">review 查看 Diff</text><text x="800.0" y="462" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#69758C" text-anchor="middle"><tspan x="800.0" dy="0">页面变更 + Citation</tspan><tspan x="800.0" dy="28">本地校验与影响范围</tspan></text><rect x="679.2" y="492" width="241.60000000000002" height="34" rx="17" fill="#FFF4D6" stroke="none" stroke-width="1" opacity="1"/><text x="800.0" y="515" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#E59B19" text-anchor="middle" opacity="1" letter-spacing="0">不接受则 reject</text><path d="M945.8000000000001 390.0 L956.8000000000001 390.0" fill="none" stroke="#8CA0BE" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" opacity="1"/><rect x="962.8000000000001" y="240" width="281.6" height="300" rx="22" fill="#FFFFFF" stroke="#D9E4F5" stroke-width="1" opacity="1" filter="url(#shadow)"/><rect x="982.8000000000001" y="260" width="58" height="34" rx="17" fill="#FFEEE4" stroke="none" stroke-width="1" opacity="1"/><text x="1011.8000000000001" y="283" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#F06A2A" text-anchor="middle" opacity="1" letter-spacing="0">04</text><rect x="1077.7600000000002" y="342.4" width="51.68000000000001" height="39.52" rx="9.12" fill="#FFEEE4" stroke="none" stroke-width="1" opacity="1"/><path d="M1088.4 343.92 V334.8 C1088.4 316.56 1118.8000000000002 316.56 1118.8000000000002 334.8 V343.92" fill="none" stroke="#F06A2A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><circle cx="1103.6000000000001" cy="360.64" r="4.56" fill="#F06A2A" stroke="none" stroke-width="1"/><text x="1103.6000000000001" y="425" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="780" fill="#1F2329" text-anchor="middle" opacity="1" letter-spacing="0">approve 独立授权</text><text x="1103.6000000000001" y="462" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#69758C" text-anchor="middle"><tspan x="1103.6000000000001" dy="0">批准收据绑定提案哈希</tspan><tspan x="1103.6000000000001" dy="28">不写 Wiki</tspan></text><rect x="982.8000000000001" y="492" width="241.60000000000002" height="34" rx="17" fill="#FFEEE4" stroke="none" stroke-width="1" opacity="1"/><text x="1103.6000000000001" y="515" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#F06A2A" text-anchor="middle" opacity="1" letter-spacing="0">批准 ≠ 写入</text><path d="M1249.4 390.0 L1260.4 390.0" fill="none" stroke="#8CA0BE" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" opacity="1"/><rect x="1266.4" y="240" width="281.6" height="300" rx="22" fill="#FFFFFF" stroke="#D9E4F5" stroke-width="1" opacity="1" filter="url(#shadow)"/><rect x="1286.4" y="260" width="58" height="34" rx="17" fill="#DDF7EE" stroke="none" stroke-width="1" opacity="1"/><text x="1315.4" y="283" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="700" fill="#17885F" text-anchor="middle" opacity="1" letter-spacing="0">05</text><ellipse cx="1407.2" cy="327.2" rx="25.840000000000003" ry="9.88" fill="#DDF7EE" stroke="#17885F" stroke-width="2"/><path d="M1381.3600000000001 327.2 V369.76 C1381.3600000000001 383.44 1433.04 383.44 1433.04 369.76 V327.2" fill="#DDF7EE" stroke="#17885F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M1381.3600000000001 348.48 C1381.3600000000001 362.16 1433.04 362.16 1433.04 348.48" fill="none" stroke="#17885F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="1407.2" y="425" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="780" fill="#1F2329" text-anchor="middle" opacity="1" letter-spacing="0">apply 发布</text><text x="1407.2" y="462" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#69758C" text-anchor="middle"><tspan x="1407.2" dy="0">写入 Markdown Wiki</tspan><tspan x="1407.2" dy="28">重建 INDEX/FTS5 + Git Commit</tspan></text><rect x="1286.4" y="492" width="241.60000000000002" height="34" rx="17" fill="#DDF7EE" stroke="none" stroke-width="1" opacity="1"/><text x="1407.2" y="515" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700" fill="#17885F" text-anchor="middle" opacity="1" letter-spacing="0">Commit 可回滚</text><path d="M800.0 540 V614 H650.0" fill="none" stroke="#D94A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)" opacity="1"/><rect x="450.0" y="588" width="200" height="86" rx="16" fill="#FFE9E9" stroke="#D94A4A" stroke-width="1" opacity="1"/><rect x="470.0" y="607" width="34" height="34" rx="7.48" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><path d="M476.12 617.88 L486.32 617.88" fill="none" stroke="#D94A4A" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M476.12 624.68 L490.4 624.68" fill="none" stroke="#18A980" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M476.12 631.48 L495.16 631.48" fill="none" stroke="#18A980" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="516.0" y="621" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="800" fill="#D94A4A" text-anchor="start" opacity="1" letter-spacing="0">reject</text><text x="516.0" y="646" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="500" fill="#69758C" text-anchor="start" opacity="1" letter-spacing="0">保留记录，不改正式 Wiki</text><path d="M1407.2 540 V590" fill="none" stroke="#17885F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)" opacity="1"/><rect x="1237.2" y="595" width="340" height="88" rx="16" fill="#DDF7EE" stroke="#18A980" stroke-width="1" opacity="1"/><text x="1407.2" y="624" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#17885F" text-anchor="middle" opacity="1" letter-spacing="0">稳定知识产物</text><text x="1407.2" y="651" font-family="'Noto Sans Mono CJK SC','SFMono-Regular','Menlo',monospace" font-size="12" font-weight="550" fill="#14213D" text-anchor="middle" opacity="1" letter-spacing="0">wiki/pages/*.md · INDEX.md · index.sqlite · .git/</text><rect x="78" y="765" width="1444" height="76" rx="18" fill="#102A56" stroke="none" stroke-width="1" opacity="1" filter="url(#shadow)"/><text x="110" y="798" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="start" opacity="1" letter-spacing="0">本地强约束</text><circle cx="277.0" cy="799.0" r="17.0" fill="#2DBB8D" stroke="none" stroke-width="1"/><path d="M268.5 799.68 L274.62 805.8 L285.84 792.2" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="305" y="805" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#EAF1FF" text-anchor="start" opacity="1" letter-spacing="0">路径只能位于 wiki/</text><circle cx="592.0" cy="799.0" r="17.0" fill="#2DBB8D" stroke="none" stroke-width="1"/><path d="M583.5 799.68 L589.62 805.8 L600.84 792.2" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="620" y="805" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#EAF1FF" text-anchor="start" opacity="1" letter-spacing="0">Citation 必须指向存在的 SourceVersion</text><circle cx="907.0" cy="799.0" r="17.0" fill="#2DBB8D" stroke="none" stroke-width="1"/><path d="M898.5 799.68 L904.62 805.8 L915.84 792.2" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="935" y="805" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#EAF1FF" text-anchor="start" opacity="1" letter-spacing="0">raw/ 不可被模型修改</text><circle cx="1222.0" cy="799.0" r="17.0" fill="#2DBB8D" stroke="none" stroke-width="1"/><path d="M1213.5 799.68 L1219.62 805.8 L1230.84 792.2" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="1250" y="805" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#EAF1FF" text-anchor="start" opacity="1" letter-spacing="0">自动更新永不自动批准</text></svg>