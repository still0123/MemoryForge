<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MemoryForge 查询链</title>
<desc id="desc">有上限的渐进式查询、support score 和可选原文核验。</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17335C" flood-opacity="0.10"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17335C" flood-opacity="0.09"/>
  </filter>
  <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1664FF"/>
    <stop offset="1" stop-color="#5B5CE2"/>
  </linearGradient>
  <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#23B88B"/>
    <stop offset="1" stop-color="#0F9FA8"/>
  </linearGradient>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F9FBFF"/>
    <stop offset="1" stop-color="#EEF4FF"/>
  </linearGradient>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L10,5.5 L0,11 z" fill="#8CA0BE"/>
  </marker>
  <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L10,5.5 L0,11 z" fill="#1664FF"/>
  </marker>
  <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L10,5.5 L0,11 z" fill="#18A980"/>
  </marker>
  <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L10,5.5 L0,11 z" fill="#D94A4A"/>
  </marker>
</defs>
<rect width="1600" height="900" rx="0" fill="#F5F8FF"/>
<text x="70" y="70" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="800" fill="#1F2329" text-anchor="start" opacity="1" letter-spacing="0">提问后，系统如何避免“沾边就回答”？</text><text x="70" y="108" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#69758C" text-anchor="start" opacity="1" letter-spacing="0">INDEX/FTS5 负责路由，少量 Wiki 页面提供事实，support score 决定回答或拒答。</text><path d="M70 131 L1530 131" fill="none" stroke="#D9E4F5" stroke-width="1" stroke-linecap="round" opacity="1"/><rect x="610" y="170" width="380" height="76" rx="20" fill="#EEEDFF" stroke="#5B5CE2" stroke-width="1" opacity="1" filter="url(#shadow)"/><rect x="636" y="188" width="40" height="31.200000000000003" rx="8.8" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><path d="M646.0 217.6 L644.0 227.2 L655.2 219.2" fill="#FFFFFF" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M644.0 200.0 L667.2 200.0" fill="none" stroke="#5B5CE2" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M644.0 207.6 L660.8 207.6" fill="none" stroke="#5B5CE2" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="696" y="205" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="800" fill="#5B5CE2" text-anchor="start" opacity="1" letter-spacing="0">用户问题</text><text x="696" y="230" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">“approve 和 apply 为什么要分开？”</text><path d="M800 246 L800 290" fill="none" stroke="#8CA0BE" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" opacity="1"/><rect x="500" y="295" width="600" height="94" rx="18" fill="#E8F1FF" stroke="#1664FF" stroke-width="1" opacity="1" filter="url(#shadow)"/><rect x="524" y="315" width="62" height="34" rx="17" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="555.0" y="338" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1664FF" text-anchor="middle" opacity="1" letter-spacing="0">L0</text><text x="604" y="337" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="780" fill="#1F2329" text-anchor="start" opacity="1" letter-spacing="0">读取 INDEX.md + SQLite FTS5</text><text x="604" y="365" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start" opacity="1" letter-spacing="0">确定候选范围；精确代码符号可直接从 Applied Code Index 路由</text><path d="M800 389 L800 425" fill="none" stroke="#8CA0BE" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" opacity="1"/><rect x="500" y="430" width="600" height="112" rx="18" fill="#DFF7F8" stroke="#0F9FA8" stroke-width="1" opacity="1" filter="url(#shadow)"/><rect x="524" y="450" width="92" height="34" rx="17" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="570.0" y="473" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#0F9FA8" text-anchor="middle" opacity="1" letter-spacing="0">L1 / L2</text><text x="636" y="472" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="780" fill="#1F2329" text-anchor="start" opacity="1" letter-spacing="0">展开少量相关 Wiki 页面</text><text x="636" y="500" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start" opacity="1" letter-spacing="0">默认最多 3 页 · Frontmatter / 摘要筛选 · 正文事实匹配</text><rect x="852" y="486" width="218" height="34" rx="17" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="961.0" y="509" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="700" fill="#0F9FA8" text-anchor="middle" opacity="1" letter-spacing="0">bounded context ≤ 3 pages</text><path d="M800 542 L800 575" fill="none" stroke="#8CA0BE" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" opacity="1"/><path d="M800 575 L975 665 L800 755 L625 665 Z" fill="#FFF4D6" stroke="#E59B19" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="800" y="637" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="800" fill="#E59B19" text-anchor="middle" opacity="1" letter-spacing="0">Support Score</text><text x="800" y="672" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="750" fill="#14213D" text-anchor="middle" opacity="1" letter-spacing="0">score ≥ 75 且硬门禁通过？</text><text x="800" y="703" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="450" fill="#69758C" text-anchor="middle" opacity="1" letter-spacing="0">标识覆盖 · 核心词覆盖 · 事实共现 · 否定对齐 · 多来源 · 当前版本</text><path d="M625 665 H420" fill="none" stroke="#D94A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)" opacity="1"/><text x="520" y="650" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" fill="#D94A4A" text-anchor="middle" opacity="1" letter-spacing="0">NO</text><rect x="100" y="605" width="300" height="120" rx="18" fill="#FFE9E9" stroke="#D94A4A" stroke-width="1" opacity="1" filter="url(#shadow)"/><rect x="126" y="637" width="44" height="44" rx="9.68" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><path d="M133.92 651.08 L147.12 651.08" fill="none" stroke="#D94A4A" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M133.92 659.88 L152.4 659.88" fill="none" stroke="#18A980" stroke-width="2" stroke-linecap="round" opacity="1"/><path d="M133.92 668.68 L158.56 668.68" fill="none" stroke="#18A980" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="186" y="645" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#D94A4A" text-anchor="start" opacity="1" letter-spacing="0">status: unknown</text><text x="186" y="674" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">返回“不知道”，不生成引用</text><text x="186" y="699" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="450" fill="#69758C" text-anchor="start" opacity="1" letter-spacing="0">不猜 · 不补全 · 不隐藏负结果</text><path d="M975 665 H1162" fill="none" stroke="#18A980" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)" opacity="1"/><text x="1068" y="650" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="800" fill="#17885F" text-anchor="middle" opacity="1" letter-spacing="0">YES</text><rect x="1180" y="575" width="330" height="128" rx="18" fill="#DDF7EE" stroke="#18A980" stroke-width="1" opacity="1" filter="url(#shadow)"/><circle cx="1229.0" cy="632.0" r="23.0" fill="#FFFFFF" stroke="none" stroke-width="1"/><path d="M1217.5 632.92 L1225.78 641.2 L1240.96 622.8" fill="none" stroke="#17885F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="1268" y="620" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#17885F" text-anchor="start" opacity="1" letter-spacing="0">基于已验证事实回答</text><text x="1268" y="650" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="550" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">答案 + Wiki 页面 + Citation</text><text x="1268" y="677" font-family="'Noto Sans Mono CJK SC','SFMono-Regular','Menlo',monospace" font-size="11" font-weight="450" fill="#69758C" text-anchor="start" opacity="1" letter-spacing="0">SourceVersion · locator · Commit / SHA256</text><path d="M1345 703 V745" fill="none" stroke="#1664FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)" opacity="1"/><rect x="1135" y="756" width="420" height="88" rx="16" fill="#E8F1FF" stroke="#1664FF" stroke-width="1" opacity="1" filter="url(#shadow)"/><rect x="1155" y="777" width="62" height="34" rx="17" fill="#FFFFFF" stroke="none" stroke-width="1" opacity="1"/><text x="1186.0" y="800" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#1664FF" text-anchor="middle" opacity="1" letter-spacing="0">L3</text><text x="1232" y="795" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="750" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">需要原文核验时读取 Evidence 片段</text><text x="1232" y="821" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" font-weight="450" fill="#69758C" text-anchor="start" opacity="1" letter-spacing="0">仅展开对应 SourceVersion 的 locator，不扫描全部 Raw</text><rect x="72" y="178" width="330" height="198" rx="18" fill="#FFFFFF" stroke="#D9E4F5" stroke-width="1" opacity="1" filter="url(#shadow)"/><text x="96" y="212" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="780" fill="#1F2329" text-anchor="start" opacity="1" letter-spacing="0">可选：MiniClaude Agent</text><text x="96" y="238" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="450" fill="#69758C" text-anchor="start" opacity="1" letter-spacing="0">只有 3 个动作，没有 Shell / MCP / 通用写权限</text><circle cx="110" cy="266" r="12" fill="#E8F1FF" stroke="none" stroke-width="1"/><text x="110" y="270" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="9" font-weight="800" fill="#1664FF" text-anchor="middle" opacity="1" letter-spacing="0">1</text><text x="132" y="271" font-family="'Noto Sans Mono CJK SC','SFMono-Regular','Menlo',monospace" font-size="12" font-weight="650" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">search_wiki</text><path d="M110 279 L110 289" fill="none" stroke="#D9E4F5" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="110" cy="300" r="12" fill="#E8F1FF" stroke="none" stroke-width="1"/><text x="110" y="304" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="9" font-weight="800" fill="#1664FF" text-anchor="middle" opacity="1" letter-spacing="0">2</text><text x="132" y="305" font-family="'Noto Sans Mono CJK SC','SFMono-Regular','Menlo',monospace" font-size="12" font-weight="650" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">read_evidence</text><path d="M110 313 L110 323" fill="none" stroke="#D9E4F5" stroke-width="2" stroke-linecap="round" opacity="1"/><circle cx="110" cy="334" r="12" fill="#E8F1FF" stroke="none" stroke-width="1"/><text x="110" y="338" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="9" font-weight="800" fill="#1664FF" text-anchor="middle" opacity="1" letter-spacing="0">3</text><text x="132" y="339" font-family="'Noto Sans Mono CJK SC','SFMono-Regular','Menlo',monospace" font-size="12" font-weight="650" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">final</text><rect x="96" y="348" width="250" height="34" rx="17" fill="#DDF7EE" stroke="none" stroke-width="1" opacity="1"/><text x="221.0" y="371" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10" font-weight="700" fill="#17885F" text-anchor="middle" opacity="1" letter-spacing="0">最终引用必须先 read_evidence</text></svg>