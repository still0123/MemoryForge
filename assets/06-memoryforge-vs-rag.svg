<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MemoryForge 与普通 RAG 对比</title>
<desc id="desc">两种知识问答系统在知识组织、更新治理、引用和拒答方面的差异。</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17335C" flood-opacity="0.10"/>
  </filter>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17335C" flood-opacity="0.09"/>
  </filter>
  <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1664FF"/>
    <stop offset="1" stop-color="#5B5CE2"/>
  </linearGradient>
  <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#23B88B"/>
    <stop offset="1" stop-color="#0F9FA8"/>
  </linearGradient>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F9FBFF"/>
    <stop offset="1" stop-color="#EEF4FF"/>
  </linearGradient>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L10,5.5 L0,11 z" fill="#8CA0BE"/>
  </marker>
  <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L10,5.5 L0,11 z" fill="#1664FF"/>
  </marker>
  <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L10,5.5 L0,11 z" fill="#18A980"/>
  </marker>
  <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
    <path d="M0,0 L10,5.5 L0,11 z" fill="#D94A4A"/>
  </marker>
</defs>
<rect width="1600" height="900" rx="0" fill="#F5F8FF"/>
<text x="70" y="70" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="800" fill="#1F2329" text-anchor="start" opacity="1" letter-spacing="0">为什么不是普通 RAG？</text><text x="70" y="108" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="400" fill="#69758C" text-anchor="start" opacity="1" letter-spacing="0">MemoryForge 的核心不是“多塞一点上下文”，而是把知识先编译、审核、版本化，再渐进式查询。</text><path d="M70 131 L1530 131" fill="none" stroke="#D9E4F5" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="800" cy="492" r="54" fill="url(#brandGrad)" stroke="none" stroke-width="1" filter="url(#softShadow)"/><text x="800" y="505" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="850" fill="#FFFFFF" text-anchor="middle" opacity="1" letter-spacing="0">VS</text><rect x="70" y="190" width="660" height="610" rx="24" fill="#FFFFFF" stroke="#D9E4F5" stroke-width="1" opacity="1" filter="url(#shadow)"/><rect x="870" y="190" width="660" height="610" rx="24" fill="#FFFFFF" stroke="#18A980" stroke-width="2" opacity="1" filter="url(#shadow)"/><rect x="70" y="190" width="660" height="92" rx="24" fill="#F1F4F9" stroke="none" stroke-width="1" opacity="1"/><rect x="70" y="254" width="660" height="28" rx="0" fill="#F1F4F9" stroke="none" stroke-width="1" opacity="1"/><text x="102" y="234" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="800" fill="#14213D" text-anchor="start" opacity="1" letter-spacing="0">普通 RAG 聊天机器人</text><text x="102" y="260" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start" opacity="1" letter-spacing="0">原文切片 → 召回 → 直接生成</text><rect x="870" y="190" width="660" height="92" rx="24" fill="#DDF7EE" stroke="none" stroke-width="1" opacity="1"/><rect x="870" y="254" width="660" height="28" rx="0" fill="#DDF7EE" stroke="none" stroke-width="1" opacity="1"/><text x="902" y="234" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="800" fill="#17885F" text-anchor="start" opacity="1" letter-spacing="0">MemoryForge 本地知识 Wiki</text><text x="902" y="260" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start" opacity="1" letter-spacing="0">SourceVersion → ChangeSet → 审核发布 → 渐进式查询</text><circle cx="118" cy="331" r="15" fill="#FFE9E9" stroke="none" stroke-width="1"/><text x="118" y="337" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#D94A4A" text-anchor="middle" opacity="1" letter-spacing="0">×</text><text x="150" y="326" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="750" fill="#1F2329" text-anchor="start" opacity="1" letter-spacing="0">知识组织</text><text x="150" y="352" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start"><tspan x="150" dy="0">原文切片直接召回，阅读结构零散</tspan></text><circle cx="918.0" cy="331.0" r="15.0" fill="#FFFFFF" stroke="none" stroke-width="1"/><path d="M910.5 331.6 L915.9 337.0 L925.8 325.0" fill="none" stroke="#17885F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="950" y="326" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="750" fill="#17885F" text-anchor="start" opacity="1" letter-spacing="0">知识组织</text><text x="950" y="352" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#14213D" text-anchor="start"><tspan x="950" dy="0">先编译为 Entity / Concept / Synthesis</tspan><tspan x="950" dy="23">形成可读 Markdown Wiki</tspan></text><path d="M98 388 L702 388" fill="none" stroke="#D9E4F5" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M898 388 L1502 388" fill="none" stroke="#D9E4F5" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="118" cy="423" r="15" fill="#FFE9E9" stroke="none" stroke-width="1"/><text x="118" y="429" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#D94A4A" text-anchor="middle" opacity="1" letter-spacing="0">×</text><text x="150" y="418" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="750" fill="#1F2329" text-anchor="start" opacity="1" letter-spacing="0">更新治理</text><text x="150" y="444" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start"><tspan x="150" dy="0">索引直接替换，缺少独立审核与回滚语义</tspan></text><circle cx="918.0" cy="423.0" r="15.0" fill="#FFFFFF" stroke="none" stroke-width="1"/><path d="M910.5 423.6 L915.9 429.0 L925.8 417.0" fill="none" stroke="#17885F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="950" y="418" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="750" fill="#17885F" text-anchor="start" opacity="1" letter-spacing="0">更新治理</text><text x="950" y="444" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#14213D" text-anchor="start"><tspan x="950" dy="0">ChangeSet → review → approve → apply</tspan><tspan x="950" dy="23">Git Commit 留痕，可回滚</tspan></text><path d="M98 480 L702 480" fill="none" stroke="#D9E4F5" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M898 480 L1502 480" fill="none" stroke="#D9E4F5" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="118" cy="515" r="15" fill="#FFE9E9" stroke="none" stroke-width="1"/><text x="118" y="521" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#D94A4A" text-anchor="middle" opacity="1" letter-spacing="0">×</text><text x="150" y="510" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="750" fill="#1F2329" text-anchor="start" opacity="1" letter-spacing="0">回答策略</text><text x="150" y="536" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start"><tspan x="150" dy="0">主题沾边就尝试生成，容易把相关当作支持</tspan></text><circle cx="918.0" cy="515.0" r="15.0" fill="#FFFFFF" stroke="none" stroke-width="1"/><path d="M910.5 515.6 L915.9 521.0 L925.8 509.0" fill="none" stroke="#17885F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="950" y="510" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="750" fill="#17885F" text-anchor="start" opacity="1" letter-spacing="0">回答策略</text><text x="950" y="536" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#14213D" text-anchor="start"><tspan x="950" dy="0">support score &lt; 75 / 硬门禁失败</tspan><tspan x="950" dy="23">返回 unknown，不瞎猜</tspan></text><path d="M98 572 L702 572" fill="none" stroke="#D9E4F5" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M898 572 L1502 572" fill="none" stroke="#D9E4F5" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="118" cy="607" r="15" fill="#FFE9E9" stroke="none" stroke-width="1"/><text x="118" y="613" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#D94A4A" text-anchor="middle" opacity="1" letter-spacing="0">×</text><text x="150" y="602" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="750" fill="#1F2329" text-anchor="start" opacity="1" letter-spacing="0">引用能力</text><text x="150" y="628" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start"><tspan x="150" dy="0">引用常漂移，难重放当时使用的版本和位置</tspan></text><circle cx="918.0" cy="607.0" r="15.0" fill="#FFFFFF" stroke="none" stroke-width="1"/><path d="M910.5 607.6 L915.9 613.0 L925.8 601.0" fill="none" stroke="#17885F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="950" y="602" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="750" fill="#17885F" text-anchor="start" opacity="1" letter-spacing="0">引用能力</text><text x="950" y="628" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#14213D" text-anchor="start"><tspan x="950" dy="0">Citation 固定到 SourceVersion + locator</tspan><tspan x="950" dy="23">+ Commit / SHA256</tspan></text><path d="M98 664 L702 664" fill="none" stroke="#D9E4F5" stroke-width="1" stroke-linecap="round" opacity="1"/><path d="M898 664 L1502 664" fill="none" stroke="#D9E4F5" stroke-width="1" stroke-linecap="round" opacity="1"/><circle cx="118" cy="699" r="15" fill="#FFE9E9" stroke="none" stroke-width="1"/><text x="118" y="705" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#D94A4A" text-anchor="middle" opacity="1" letter-spacing="0">×</text><text x="150" y="694" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="750" fill="#1F2329" text-anchor="start" opacity="1" letter-spacing="0">评测边界</text><text x="150" y="720" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="450" fill="#69758C" text-anchor="start"><tspan x="150" dy="0">只看最终答案，召回、引用和拒答问题混在一起</tspan></text><circle cx="918.0" cy="699.0" r="15.0" fill="#FFFFFF" stroke="none" stroke-width="1"/><path d="M910.5 699.6 L915.9 705.0 L925.8 693.0" fill="none" stroke="#17885F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="950" y="694" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="750" fill="#17885F" text-anchor="start" opacity="1" letter-spacing="0">评测边界</text><text x="950" y="720" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#14213D" text-anchor="start"><tspan x="950" dy="0">答案、Citation、拒答、展开页数</tspan><tspan x="950" dy="23">和原文读取数分开评测</tspan></text><rect x="220" y="824" width="1160" height="52" rx="16" fill="#102A56" stroke="none" stroke-width="1" opacity="1" filter="url(#shadow)"/><text x="800" y="857" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="720" fill="#FFFFFF" text-anchor="middle" opacity="1" letter-spacing="0">MemoryForge = 人类可读的 Wiki + 机器可检索的索引 + 可审计的发布与引用链</text></svg>