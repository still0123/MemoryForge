name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    # Zero-spend policy: keep remote jobs disabled; publish locally if needed.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints/dev.txt
      - name: Verify annotated version tag
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "$GITHUB_REF_NAME^{}")" = "$GITHUB_SHA"
          version="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Install frozen build dependencies
        run: python -m pip install -c constraints/dev.txt build hatchling
      - name: Build Wheel and sdist
        run: python -m build --wheel --sdist --no-isolation --outdir dist
      - name: Verify Wheel
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints/dev.txt
        run: |
          python demo/run_release_check.py \
            --wheel dist/memoryforge-*.whl \
            --workdir /tmp/memoryforge-wheel-check \
            --output dist/release-provenance.json
      - name: Verify sdist
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints/dev.txt
        shell: bash
        run: |
          python -m venv /tmp/memoryforge-sdist-check
          /tmp/memoryforge-sdist-check/bin/python -m pip install hatchling
          /tmp/memoryforge-sdist-check/bin/python -m pip install \
            --no-build-isolation dist/memoryforge-*.tar.gz
          /tmp/memoryforge-sdist-check/bin/python -m pip check
          /tmp/memoryforge-sdist-check/bin/python -m memoryforge --help
      - name: Bind provenance to tag and artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          provenance_path = Path("dist/release-provenance.json")
          provenance = json.loads(provenance_path.read_text())
          if provenance["memoryforge_commit"] != os.environ["RELEASE_COMMIT"]:
              raise SystemExit("provenance commit does not match tag commit")
          sdist = next(Path("dist").glob("memoryforge-*.tar.gz"))
          provenance["release"] = {
              "tag": os.environ["RELEASE_TAG"],
              "tag_commit": os.environ["RELEASE_COMMIT"],
              "sdist": sdist.name,
              "sdist_sha256": hashlib.sha256(sdist.read_bytes()).hexdigest(),
              "sdist_clean_room": True,
              "attestation": (
                  "required"
                  if os.environ["REPOSITORY_VISIBILITY"] == "public"
                  else "not_applicable_private_repository"
              ),
          }
          provenance_path.write_text(json.dumps(provenance, indent=2) + "\n")
          PY
          (
            cd dist
            sha256sum memoryforge-*.whl memoryforge-*.tar.gz release-provenance.json \
              > SHA256SUMS
          )
      - name: Attest public repository artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/memoryforge-*.whl
            dist/memoryforge-*.tar.gz
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/memoryforge-*.whl \
            dist/memoryforge-*.tar.gz \
            dist/release-provenance.json \
            dist/SHA256SUMS \
            --clobber
      - name: Verify downloaded Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir /tmp/memoryforge-release-assets
          gh release download "$GITHUB_REF_NAME" --dir /tmp/memoryforge-release-assets
          cd /tmp/memoryforge-release-assets
          sha256sum --check SHA256SUMS
