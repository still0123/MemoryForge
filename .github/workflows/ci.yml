name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: constraints/dev.txt
      - run: python -m pip install -c constraints/dev.txt -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -W error::ResourceWarning --cov=memoryforge --cov-report=term-missing
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python -m build --wheel --sdist --no-isolation --outdir dist
          python demo/run_release_check.py \
            --wheel dist/memoryforge-*.whl \
            --workdir /tmp/memoryforge-release-check \
            --output /tmp/memoryforge-release-provenance.json
          python -m venv /tmp/memoryforge-sdist-check
          /tmp/memoryforge-sdist-check/bin/python -m pip install \
            -c constraints/dev.txt hatchling
          /tmp/memoryforge-sdist-check/bin/python -m pip install \
            -c constraints/dev.txt --no-build-isolation dist/memoryforge-*.tar.gz
          /tmp/memoryforge-sdist-check/bin/python -m pip check
          /tmp/memoryforge-sdist-check/bin/python -m memoryforge --help
