[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memoryforge-wiki"
version = "0.4.0"
description = "A local-first, auditable knowledge compiler for technical docs and source code."
readme = "PACKAGE_README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ranmaoxia0123" }]
keywords = [
  "ai-agent",
  "knowledge-management",
  "local-first",
  "rag",
  "wiki",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2.7,<3",
  "tree-sitter>=0.23,<0.26",
  "tree-sitter-go>=0.23,<1",
  "tree-sitter-python>=0.23,<1",
  "tree-sitter-typescript>=0.23,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
desktop = [
  "pyinstaller>=6,<7",
  "pywebview>=5,<7",
]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.31,<2",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
memoryforge = "memoryforge.interface.cli:main"
memoryforge-desktop = "memoryforge.portal.desktop:main"

[project.urls]
Homepage = "https://github.com/still0123/MemoryForge"
Documentation = "https://github.com/still0123/MemoryForge#readme"
Repository = "https://github.com/still0123/MemoryForge.git"
Issues = "https://github.com/still0123/MemoryForge/issues"
Changelog = "https://github.com/still0123/MemoryForge/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/memoryforge"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/PACKAGE_README.md",
  "/pyproject.toml",
  "/src",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Frozen experiment input; changing its import order would invalidate registered Evidence.
"tests/test_folder_import.py" = ["I001"]
"tests/test_github_thread_import.py" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["memoryforge"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["memoryforge"]
