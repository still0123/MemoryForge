[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memoryforge"
version = "0.2.0"
description = "An auditable local knowledge ingestion and search CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ranmaoxia0123" }]
dependencies = [
  "pydantic>=2.7,<3",
  "tree-sitter>=0.23,<0.26",
  "tree-sitter-go>=0.23,<1",
  "tree-sitter-python>=0.23,<1",
  "tree-sitter-typescript>=0.23,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
memoryforge = "memoryforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memoryforge"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["memoryforge"]
