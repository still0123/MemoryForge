[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memoryforge"
version = "0.1.0"
description = "A Git-backed, auditable LLM Wiki agent for personal developer knowledge."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "MemoryForge Contributors" },
]
keywords = ["knowledge-base", "llm", "wiki", "git", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
memoryforge = "memoryforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memoryforge"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
warn_unreachable = true
